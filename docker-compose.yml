# docker-compose.yml
# Fichier definitif - completer les sections marquees "A CONFIRMER"
# une fois le backend disponible.
services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000/api   # A CONFIRMER : vrai port backend
    depends_on:
      - backend

  backend:
    build:
      context: ./backend                          # A CONFIRMER : chemin du Dockerfile backend
    ports:
      - "3000:3000"                                # A CONFIRMER : vrai port d'ecoute
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/plateforme_partenariat
      - JWT_SECRET=change-moi-en-dev              # A CONFIRMER : nom exact de la variable
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plateforme_partenariat
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data: