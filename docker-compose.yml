services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: uf_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - backend

  db:
    image: postgres:16-alpine
    container_name: uf_db
    environment:
      POSTGRES_DB: plateforme_partenariat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: uf_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/plateforme_partenariat?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: development
      # Origines autorisees en CORS (separees par des virgules)
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Envoi d'e-mails : noop (journalisation) ou smtp
      MAIL_MODE: ${MAIL_MODE:-noop}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  db_data:
