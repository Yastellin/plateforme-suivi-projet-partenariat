services:
  frontend:
    build:
      context: ./frontend
      target: development
    container_name: uf_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Par défaut, le navigateur utilise /api sur l'origine du frontend ;
      # Vite relaie ensuite la requête vers le service backend du compose.
      VITE_API_URL: ${VITE_API_URL:-/api}
      DEV_API_PROXY_TARGET: http://backend:3000
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: uf_db
    environment:
      POSTGRES_DB: plateforme_partenariat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: development
    container_name: uf_backend
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    # CORRIGE : charger toutes les variables du backend/.env.
    # Sans cette directive, docker compose ne lit que le .env a la racine
    # du projet (ou les variables du shell), pas le backend/.env.
    env_file:
      - ./backend/.env
    # CORRIGE : ne garder dans 'environment' que ce qui doit etre
    # specifique au conteneur (hote 'db' au lieu de 'localhost').
    # Les variables MAIL_*, SMTP_*, FRONTEND_URL, MOT_DE_PASSE_RESET_EXPIRATION_MINUTES
    # et TZ_APPLICATION viennent maintenant de backend/.env via env_file.
    # NOTE : 'environment' ecrase toujours 'env_file' en cas de conflit,
    # donc DATABASE_URL est volontairement conserve ici avec 'db' comme hote.
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/plateforme_partenariat
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      NODE_ENV: development
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      # Le backend suit désormais les changements de source comme le frontend.
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    healthcheck:
      # Vérifie aussi le contrat requis par le frontend. Une ancienne image API
      # ne peut ainsi plus démarrer silencieusement avec des routes manquantes.
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/api/health | grep -q '\"parametres_logos\":\"v2\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  db_data:
